name: python_3_with_R
channels:
  - conda-forge
  - defaults
dependencies:
  - python=3.11
  - pycodestyle
  - scipy
  # PySpark 3.5 no esta testeado contra numpy 2.x ni pandas 3.x.
  - numpy<2
  - pandas<3
  - grpcio
  - protobuf
  - pandasql
  - ipython
  - ipykernel
  - jupyter_client
  - hvplot
  - plotnine
  - seaborn
  - intake
  - intake-parquet
  - intake-xarray
  - altair
  - vega_datasets
  - plotly>=6.2,<7
  - pip
  - r-base=3
  - r-data.table
  - r-evaluate
  - r-base64enc
  - r-knitr
  - r-ggplot2
  - r-irkernel
  - r-shiny
  - r-googlevis
